name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0

      # The embedded Chroma runtime bootstraps an ONNX shared library and model
      # into ~/.cache/chroma on first use. Two facts make that hostile to CI:
      #
      #   - it costs ~250 MB and over a minute per cold run,
      #   - several test binaries extracting the same archive concurrently
      #     corrupted the library and killed the process with SIGBUS.
      #
      # Caching it removes the repeated cost; warming it in its own step and
      # serializing the tests below removes the concurrency.
      - name: Cache the Chroma runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-runtime-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            chroma-runtime-${{ runner.os }}-

      - name: Warm the Chroma runtime
        run: go test -tags=integration -run TestChromaStoreContract/CountChunks ./internal/store/

      # -p 1 stops go test running package binaries in parallel, which is what
      # triggered the concurrent extraction.
      - name: integration tests
        run: go test -p 1 -count=1 -tags=integration ./...

  lint:
    name: lint
    uses: ./.github/workflows/lint.yml

  vet-format:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi