# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: docmcp

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: docmcp
    # The ONNX runtime behind the default embedder is cgo, so binaries are not
    # portable across build hosts. That is why CGO_ENABLED stays on and why the
    # matrix is explicit rather than "all uname combinations".
    main: ./cmd/docmcp
    binary: docmcp
    flags:
      - -mod=vendor
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: docmcp
    ids: [docmcp]
    formats: ["tar.gz"]
    name_template: >-
      docmcp_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - src: examples/README.md
        dst: examples/README.md
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  groups:
    - title: "🚀 Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "⚡ Performance"
      regexp: "^perf"
      order: 2
    - title: "🔒 Security"
      regexp: "^sec"
      order: 3
    - title: "Other"
      order: 999
  filters:
    exclude:
      # Docs, tests, and chores are real work but not what a user upgrading
      # wants to read about.
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: docmcp
    name: docmcp
  draft: false
  prerelease: auto
  name_template: "DocMCP {{.Tag}}"
  footer: |
    ---
    **Full Changelog**: https://github.com/docmcp/docmcp/compare/{{ .PreviousTag }}...{{ .Tag }}
    Released by [GoReleaser](https://goreleaser.com).

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ .Tag }}-next"